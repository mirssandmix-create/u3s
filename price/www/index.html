<!DOCTYPE html>
<!-- ใบราคา 3ส. — หน้าแอพเดียว ใช้ทั้งแอพ Android (assets/www) และเว็บแอพ iPhone (tools/build_price.py ใส่หัวเว็บแอพให้)
     ตัวคิด px-core.js · หน้าจอ px-app.js · ไม่มีลิงก์ร้าน/รหัสในไฟล์ (ใส่ตอนเปิดครั้งแรก) -->
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<!--WEB-HEAD-->
<title>ใบราคา 3ส.</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="poster.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#f6f7f5;--card:#fff;--line:#e1e5e0;--tx:#1f2933;--mu:#5f6b74;--ac:#2f8a4f;--acd:#256f3f;--acs:#e3f2e7;--box:#fff;--boxb:#cfd6cf;
 --chg:#fff6e0;--chgb:#e0a63a;--up:#2f7d46;--dn:#c0392b;--bad:#fdecea;--badb:#d9534f;--hd:#fff;--warn:#fff4e5;--warnb:#f0c27a}
html,body{height:100%;background:var(--bg);color:var(--tx);font:600 16px/1.4 Prompt,'Noto Sans Thai',Tahoma,sans-serif;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.hidden{display:none!important}
/* หัว */
.top{background:var(--hd);padding:12px 14px 10px;border-bottom:1px solid var(--line);flex:none}
.title{display:flex;align-items:center;gap:8px}
.title h1{font-size:21px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title small{font-size:12px;color:var(--mu);font-weight:600;text-align:right;line-height:1.25}
.ibtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:18px;display:flex;align-items:center;justify-content:center;flex:none}
.ibtn:disabled{opacity:.45}
.pills{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.pill{padding:6px 14px;border-radius:999px;font-size:14px;border:1px solid var(--line);color:var(--mu);background:var(--card);white-space:nowrap;flex:none}
.pill.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.search{margin-top:10px;display:flex;align-items:center;gap:6px;background:var(--box);border:1px solid var(--boxb);border-radius:12px;padding:0 10px}
.search input{flex:1;border:0;outline:0;background:none;padding:9px 2px;font-size:15px;min-width:0}
.search button{color:var(--mu);font-size:15px;padding:4px}
/* เนื้อ */
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 12px 16px;overscroll-behavior:contain}
.banner{margin:6px 0 4px;padding:9px 12px;border-radius:12px;font-size:14px;background:var(--warn);border:1px solid var(--warnb);color:#7a4a00}
.banner.err{background:var(--bad);border-color:var(--badb);color:#8a1f1a}
.banner.ok{background:var(--acs);border-color:#b6dcc1;color:var(--acd)}
.cat{font-size:14px;color:var(--ac);margin:12px 2px 6px;font-weight:700}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px 8px 12px;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.it.chg{background:var(--chg)}
.it.bad{background:var(--bad)}
.nm{flex:1;min-width:0;font-size:16px;line-height:1.25;word-break:break-word}
.nm small{display:block;font-size:12px;color:var(--mu);font-weight:600;margin-top:1px}
.nm small b{font-weight:700}
.pr{width:96px;text-align:right;background:var(--box);border:1px solid var(--boxb);border-radius:10px;padding:6px 9px;font-size:19px;font-weight:700;outline:0}
.pr:focus{border-color:var(--ac);box-shadow:0 0 0 2px var(--acs)}
.it.chg .pr{border-color:var(--chgb)}
.it.bad .pr{border-color:var(--badb);color:var(--dn)}
.u{font-size:12px;color:var(--mu);width:30px;line-height:1.15}
.up{color:var(--up)}.dn{color:var(--dn)}
.empty{text-align:center;color:var(--mu);padding:40px 16px;font-size:15px}
/* ร้านพ่อ */
.sp{font-size:20px;font-weight:700;text-align:right;min-width:70px}
.sp small{display:block;font-size:11px;color:var(--mu);font-weight:600}
.use{font-size:13px;color:var(--ac);border:1px solid #b6dcc1;background:var(--acs);border-radius:999px;padding:4px 10px;white-space:nowrap}
.eye{font-size:12px;color:var(--mu);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 9px;white-space:nowrap;flex:none}
.it.off{opacity:.55}
.upd{width:100%;margin:6px 0 8px;padding:13px;border-radius:14px;background:var(--ac);color:#fff;font-size:17px;font-weight:700}
.upd:disabled{opacity:.6}
.ck{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.ck:last-child{border-bottom:0}
.ck input{width:22px;height:22px;accent-color:var(--ac);flex:none}
.ck .n{flex:1;min-width:0;font-size:15px}
.ck .n small{display:block;color:var(--mu);font-size:12px}
.ck .r{text-align:right;white-space:nowrap;font-size:15px}
.ck.off .n,.ck.off .r{opacity:.5}
.sec{font-size:13px;color:var(--mu);margin:12px 2px 2px}
.tip{font-size:12px;color:var(--mu);text-align:center;margin-top:4px}
.chartbox{position:relative;margin-top:8px;user-select:none;-webkit-user-select:none}
.ylab{position:absolute;left:2px;font-size:11px;color:var(--mu);background:rgba(255,255,255,.75);padding:0 3px;border-radius:4px;pointer-events:none}
.selhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.selhead .when{font-size:14px;color:var(--mu)}
/* แถบล่าง */
.bar{flex:none;padding:10px 12px;background:var(--hd);border-top:1px solid var(--line);display:flex;gap:8px}
.btn{flex:1;text-align:center;border-radius:14px;padding:12px 6px;font-size:16px;font-weight:700;border:1px solid var(--line);background:var(--card)}
.btn.main{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn:disabled{opacity:.5}
.nav{flex:none;display:flex;justify-content:space-around;padding:6px 6px calc(8px + env(safe-area-inset-bottom));background:var(--hd);border-top:1px solid var(--line)}
.nav button{flex:1;font-size:12px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0}
.nav button span{font-size:21px;line-height:1.2}
.nav button.on{color:var(--ac)}
/* กล่องทั่วไป */
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.big{font-size:40px;font-weight:700;line-height:1.1}
.big small{font-size:16px;color:var(--mu);font-weight:600}
.lbl{font-size:14px;color:var(--mu)}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:15px}
.hrow:last-child{border-bottom:0}
.hrow small{color:var(--mu);font-size:12px;display:block;font-weight:600}
.hrow .r{text-align:right;white-space:nowrap}
.hrow.tap{cursor:pointer}
.chart{color:var(--tx);margin-top:6px}
.chartlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-top:2px}
.back{color:var(--ac);font-size:15px;padding:4px 0;margin-bottom:6px}
/* ใบราคา */
.posterImg{width:100%;border-radius:10px;border:1px solid var(--line);display:block;background:#fff;cursor:zoom-in}
#zoomV{position:fixed;inset:0;z-index:40;background:#111;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none}
#zoomV img{position:absolute;left:50%;top:50%;transform-origin:center;max-width:none;will-change:transform}
#zoomV .zx{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:12px;width:52px;height:52px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#111;font:inherit;font-size:24px;font-weight:700}
#zoomV .zh{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);text-align:center;color:#ddd;font-size:15px;pointer-events:none}
.pEdit{display:flex;gap:10px;margin-top:12px}.pEdit .btn{flex:1;font-size:16px}
.eLbl{font-size:14px;color:var(--mu,#667);margin:10px 0 4px}
.eIn{width:100%;min-width:0;font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:inherit}
.eSec{margin:16px 0 6px}.eSec .eIn{font-weight:700;background:#f1f6f2}
.eRow{display:flex;align-items:center;gap:6px;margin:5px 0}.eRow .eIn{flex:1}.eRow .ePr{flex:0 0 96px;text-align:right}
.eRow .up{color:#1b7a3e}.eRow .dn{color:#c62828}
.pxCover{position:fixed;inset:0;z-index:50;background:#f5f5f3;display:grid;place-items:center;font-size:18px;font-weight:600;color:#444}
.hint{font-size:13px;color:var(--mu);margin:10px 4px}
/* หน้าต่างล่าง */
.sheet{position:fixed;inset:0;background:rgba(20,25,30,.42);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet .in{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;max-height:88%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet h2{font-size:19px;font-weight:700;padding:16px 16px 6px}
.sheet .sc{overflow-y:auto;padding:4px 16px 8px}
.sheet .bar{border-top:1px solid var(--line);background:transparent}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#24302a;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90%;text-align:center}
/* ตั้งค่าครั้งแรก */
.setup{flex:1;overflow-y:auto;padding:24px 18px}
.setup h1{font-size:24px;font-weight:700;margin-bottom:4px}
.setup p{color:var(--mu);font-size:14px;margin-bottom:16px}
.field{margin-bottom:12px}
.field label{display:block;font-size:14px;color:var(--mu);margin-bottom:4px}
.field input{width:100%;background:var(--box);border:1px solid var(--boxb);border-radius:12px;padding:11px 12px;font-size:16px;outline:0}
.field input:focus{border-color:var(--ac)}
.busy{opacity:.6;pointer-events:none}
.sheet.busy{opacity:1;pointer-events:auto}.sheet.busy .in{opacity:.6;pointer-events:none}
</style>
</head><body>
<div id="app">
 <!-- ตั้งค่าครั้งแรก / เข้าสู่ระบบใหม่ -->
 <div id="setup" class="setup hidden">
  <h1>💲 ใบราคา 3ส.</h1>
  <p>เข้าสู่ระบบด้วยชื่อผู้ใช้และรหัสผ่านเดียวกับเว็บแอพซื้อของ · มือถือไม่เก็บรหัสผ่าน</p>
  <div class="banner err hidden" id="setErr"></div>
  <div class="field" id="urlField"><label for="setUrl">ลิงก์เว็บแอพซื้อของ (ที่ลงท้าย /exec)</label>
   <input id="setUrl" type="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec"></div>
  <div class="field"><label for="setUser">ชื่อผู้ใช้</label><input id="setUser" autocomplete="username" autocapitalize="off" spellcheck="false"></div>
  <div class="field"><label for="setPass">รหัสผ่าน</label><input id="setPass" type="password" autocomplete="current-password"></div>
  <button class="btn main" id="setGo" style="width:100%;margin-top:6px">เข้าสู่ระบบ</button>
 </div>

 <!-- หน้าหลัก -->
 <div id="main" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <div class="top">
   <div class="title"><h1 id="hTitle">ราคารับซื้อ</h1><small id="hSub"></small>
    <button class="ibtn" id="btnRefresh" aria-label="ดึงราคาล่าสุด">🔄</button>
    <button class="ibtn" id="btnMe" aria-label="บัญชี">👤</button></div>
   <div class="pills" id="pills"></div>
   <div class="search" id="searchBox"><span>🔍</span><input id="q" type="search" placeholder="ค้นหาสินค้า" autocomplete="off"><button id="qClear" class="hidden" aria-label="ล้างคำค้น">✕</button></div>
  </div>
  <div class="body" id="body"></div>
  <div class="bar hidden" id="saveBar"><button class="btn" id="btnUndo">ยกเลิก</button><button class="btn main" id="btnSave">💾 บันทึก</button></div>
  <div class="bar hidden" id="posterBar"><button class="btn" id="btnKeep">💾 เก็บรูป</button><button class="btn main" id="btnShare">ส่ง LINE</button></div>
  <div class="nav" id="nav">
   <button data-tab="price" class="on"><span>💲</span>ราคา</button>
   <button data-tab="hist"><span>📈</span>ประวัติ</button>
   <button data-tab="poster"><span>🖼️</span>ใบราคา</button>
  </div>
 </div>
</div>
<canvas id="cv" class="hidden"></canvas>
<script src="px-core.js"></script>
<script src="px-app.js"></script>
</body></html>
