$("#cy").addEventListener("change", function () {
  if (Object.keys(TICK).length && !confirm("เปลี่ยนรอบแล้วติ๊กที่ยังไม่บันทึกจะหาย — เปลี่ยนเลยไหม?")) { this.value = V.cycle; return; }
  V.cycle = this.value; TICK = {}; load(false);
});
$("#q").addEventListener("input", function () { V.q = this.value; paintList(); });
$("#rf").addEventListener("click", function () { load(true); toast("กำลังโหลดใหม่จากเว็บ…"); });
$("#bk").addEventListener("click", goList);
$("#cfg").addEventListener("click", function () {
  if (Object.keys(TICK).length && !confirm("มีติ๊กที่ยังไม่บันทึก — ออกจากหน้านี้แล้วติ๊กจะหาย ไปต่อไหม?")) return;
  location.href = "setup.html?change=1";
});
$("#barX").addEventListener("click", function () { TICK = {}; paint(); });
$("#barS").addEventListener("click", function () {
  var ks = Object.keys(TICK); if (!ks.length || BUSY) return;
  var over = trucks().filter(function (g) { return tickedPay(g) > dueOf(g) + 0.009; });
  if (over.length) { alert(over.map(function (g) { return "รถ " + g.truckNo + ": ติ๊ก " + money(tickedPay(g)) + " บาท เกินยอดค้าง " + money(dueOf(g)) + " บาท"; }).join("\n") + "\n\n(มีการชำระยอดรอบแบบก้อนไปแล้ว) — เอาติ๊กออกบางบิลก่อนบันทึก" + (V.view === "all" ? "\nหรือเลือกดูทีละสาขา" : "")); return; }
  var s = tickSum(), lines = Object.keys(s.trucks).map(function (no) { return "รถ " + no + ": " + sumText(s.trucks[no], false); });
  if (!confirm((s.pay ? "บันทึกจ่ายเงินรถ รวม " + money(s.pay) + " บาท" : "ยกเลิกการจ่าย รวม " + money(s.un) + " บาท") + "\n\n" + lines.join("\n") + "\n\nบันทึกเลยไหม?")) return;
  var ch = ks.map(function (k) { var a = k.split("|"); return { tripId: a[0], part: a[1], paid: !!TICK[k] }; });
  BUSY = true; paintBar();
  api("gb/ticks", { changes: ch, cycle: V.cycle, view: V.view }, function (j) {
    BUSY = false;
    if (j && j.ok) { TICK = {}; toast(j.state === "offline" ? "บันทึกในมือถือแล้ว · จะส่งขึ้นเว็บเองเมื่อมีเน็ต" : "บันทึกแล้ว · กำลังส่งขึ้นเว็บ…"); take(j); }
    else { paintBar(); alert("บันทึกไม่สำเร็จ: " + (j && j.error || "ไม่ทราบสาเหตุ")); }
  });
});
try { ShopAndroid.ready(); } catch (e) {}
api("gb/state", { cycle: V.cycle, view: V.view }, function (j) { take(j); if (j && j.login !== false) load(false); });
</script>
