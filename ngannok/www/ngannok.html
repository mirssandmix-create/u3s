/* แผนที่พื้นหลัง กทม. + ปริมณฑล (จอคอม) — ดู geoInit ในสคริปต์ */
#geoMap,#geoInfo{display:none}
/* ปกติ (ไม่ได้เลือกงาน) = รายการกลางจอแบบเดิม แผนที่ซ่อน · เลือกงาน/เปิดแผนที่ (geoAct) = แผนที่เด้งขึ้น รายการชิดซ้าย */
body.geoOn #geoMap{display:block;position:fixed;inset:0;z-index:0;background:var(--bg);cursor:grab;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s .45s}
body.geoOn.geoAct #geoMap{opacity:1;visibility:visible;transition:opacity .45s ease}
#geoOpen{display:none}
body.geoOn:not(.geoAct):not(.calw) #geoOpen{display:block;position:fixed;right:18px;bottom:64px;z-index:2}
body.geoOn #geoMap:active{cursor:grabbing}
body.geoPick #geoMap{cursor:crosshair}
body.geoOn #geoMap .leaflet-tile-pane{opacity:.82;filter:saturate(.85)}
body.geoOn #geoMap .leaflet-control-attribution{background:#fff9;font-size:10px}
body.geoOn #geoMap .leaflet-bottom.leaflet-right{margin-bottom:48px}
body.geoOn #geoMap .leaflet-control-zoom a{width:38px;height:38px;line-height:36px;font-size:22px}
body.geoOn .wrap{position:relative;z-index:1}
/* เลือกงาน/เปิดแผนที่ = รายการแคบลงชิดซ้าย (เลื่อนไปนุ่ม ๆ) เหลือที่ให้แผนที่มากขึ้น · ปฏิทินใช้เต็มจอเหมือนเดิม
   20 ต.ค.: เดิมรายการกว้าง 960 ที่ว่างในการ์ดเยอะ แผนที่เหลือนิดเดียว + กระโดดไปทันที */
body.geoOn:not(.calw) .wrap{margin-left:max(0px,calc((100% - 960px)/2));transition:margin-left .45s cubic-bezier(.22,.8,.24,1),max-width .45s cubic-bezier(.22,.8,.24,1)}
body.geoOn.geoAct:not(.calw):not(.geoOnly) .wrap{margin-left:16px;max-width:min(600px,55vw)}
body.geoOn .card{transition:box-shadow .25s}
body.geoOn.geoAct .day{display:inline-block;background:#ffffffd9;padding:2px 12px;border-radius:10px}
body.geoOn.geoAct .empty{background:#ffffffd9;border-radius:14px}
body.geoOn .card.geoHi,body.geoOn .cev.geoHi{box-shadow:0 0 0 2px var(--c),0 8px 22px #0003}
body.geoOn .card.geoSel,body.geoOn .cev.geoSel{box-shadow:0 0 0 4px var(--c),0 10px 28px #0004}
body.geoOn .card[data-gid]{cursor:pointer}
#geoInfo .gsel{margin:-2px 0 6px;font-size:12.5px;font-weight:700;color:#7c3aed}
.geoBtns{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.geoBtn{background:#fff;border:0;border-radius:10px;padding:7px 12px;font:700 14px Prompt,sans-serif;color:#111827;box-shadow:0 2px 8px #0003;cursor:pointer}
.geoBtn:hover{background:#f0fdf4}
.geoBtn.need{background:#16a34a;color:#fff;animation:geoNeed 1.6s ease-in-out infinite}
@keyframes geoNeed{50%{box-shadow:0 0 0 6px #16a34a40}}
.geoPin{cursor:pointer}
.geoPin i{position:absolute;left:-8px;top:-8px;width:16px;height:16px;border-radius:50%;background:var(--gc);border:3px solid #fff;box-shadow:0 1px 4px #0005}
.geoPin b{position:absolute;left:12px;top:-13px;white-space:nowrap;background:#fffffff2;border-left:4px solid var(--gc);border-radius:7px;padding:2px 8px;font:600 13px Prompt,sans-serif;color:#111827;box-shadow:0 1px 5px #0003}
.geoPin b u{text-decoration:none;color:#374151;font-weight:700}
.geoPin b.td u{color:#fff;background:var(--gc);border-radius:5px;padding:0 5px}
.geoPin:hover b{background:#fff;box-shadow:0 0 0 2px var(--gc)}
.geoShop i{position:absolute;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;background:#16a34a;border:3px solid #fff;box-shadow:0 2px 8px #0005;font-style:normal;font-size:17px;line-height:28px;text-align:center}
.geoShop b{position:absolute;left:22px;top:-13px;white-space:nowrap;background:#16a34a;color:#fff;border-radius:8px;padding:2px 9px;font:700 13px Prompt,sans-serif;box-shadow:0 1px 5px #0003}
.geoShop.cand i{background:#f59e0b}.geoShop.cand b{background:#f59e0b}
.geoFocus i{position:absolute;left:-12px;top:-12px;width:24px;height:24px;border-radius:50%;background:var(--gc);border:4px solid #fff;box-shadow:0 0 0 1px #0004,0 3px 10px #0004}
.geoFocus i::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:3px solid var(--gc);animation:geoPulse 1.4s ease-out infinite}
@keyframes geoPulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
.geoFocus i{animation:geoPop .4s cubic-bezier(.3,1.5,.5,1)}
@keyframes geoPop{from{transform:scale(0)}to{transform:scale(1)}}
/* เลือกงาน (มีรายการอยู่ซ้าย): ไม่มีกล่องข้อมูลขวา (ซ้ำกับการ์ด) · ระยะทาง/เวลาเป็นป้ายบนแผนที่เหนือจุดงาน · กำลังคำนวณ/หาไม่ได้ = ป้ายเล็กกลางด้านบน */
#geoPill{display:none}
body.geoOn.geoAct:not(.geoOnly) #geoPill:not([hidden]){display:block;position:fixed;top:72px;z-index:3;transform:translateX(-50%);max-width:min(520px,calc(100vw - 680px));background:#fff;border-radius:20px;padding:6px 14px;box-shadow:0 4px 14px #0003;font-size:13.5px;font-weight:600;color:#374151;animation:geoIn .3s ease-out}
#geoPill.warn{background:#fef3c7;color:#92400e}
@keyframes geoIn{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,0)}}
.leaflet-tooltip.geoTip{background:#fff;border:0;border-radius:12px;padding:7px 12px;box-shadow:0 4px 16px #0004;font:600 13px/1.5 Prompt,sans-serif;color:#111827;white-space:nowrap;animation:geoFade .4s ease-out}
.leaflet-tooltip-top.geoTip::before{border-top-color:#fff}
.geoTip b{font-size:15px}.geoTip .mu{color:#6b7280;font-weight:500;font-size:12px}.geoTip .lg{font-weight:800;color:var(--c)}
@keyframes geoFade{from{opacity:0}to{opacity:1}}
/* กล่องขวาบน: วัน-เวลานัด + ระยะทาง / เวลาเดินทาง · ตั้งตำแหน่งร้าน */
body.geoOn #geoInfo:not([hidden]){display:block;position:fixed;right:16px;top:86px;z-index:3;width:340px;max-width:calc(100vw - 32px);background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 6px 24px #0003;border-top:5px solid #16a34a;font-size:14px}
body.geoOnly header,body.geoOnly .wrap{display:none}
body.geoOnly #geoInfo:not([hidden]){top:16px}
.geoBtn#geoOnlyBtn{background:#14532d;color:#fff}.geoBtn#geoOnlyBtn:hover{background:#166534}
.geoBtn#geoCloseBtn{color:#b91c1c}
body.geoOn #geoInfo:not([hidden]){max-height:calc(100vh - 110px);overflow:auto}

<script>
const BUILD_UI='ngannok-20261002-13';
let J={},STAFF=[],ME='',TAB='active',Q='',BUSY=false,LAST_LOG='',TT;
try{ME=localStorage.getItem('ngannok_me')||''}catch(e){}
const TABS={active:'งานที่ยังไม่ปิด',review:'\uD83D\uDD0D รอตรวจสอบ',cal:'\uD83D\uDCC5 ปฏิทิน',hist:'📁 ประวัติ',sum:'\uD83D\uDCCA สรุปยอด'};
const CATS=['\uD83D\uDCA7 น้ำ','\uD83C\uDF5A ข้าว','✏️ อื่นๆ'],SRC=['หักจากเงินค่างาน','ลูกน้องออกก่อน','เงินร้าน'];
const TYPES=['ขนทิ้ง','ขนย้าย','รื้อ + ขนทิ้ง','อื่นๆ'];
const TH_D=['อา','จ','อ','พ','พฤ','ศ','ส'],TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const $=id=>document.getElementById(id);
const p2=n=>('0'+n).slice(-2);
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
// เวลาไทยคงที่ (UTC+7) เหมือนรหัส.gs — เครื่องที่ไม่ได้ตั้งโซนไทยจะได้ค่าเดียวกับเซิร์ฟเวอร์ (bkkDay อยู่ด้านล่าง เรียกตอนใช้งาน)
const TODAY=()=>bkkDay(Date.now());
const nowHM=()=>hm(Date.now());
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-US');
function fmtD(s){if(!s)return'';const[y,m,d]=s.split('-').map(Number);return `${TH_D[new Date(y,m-1,d).getDay()]} ${d} ${TH_M[m-1]}`}
const hm=t=>{const d=new Date(t+252e5);return p2(d.getUTCHours())+':'+p2(d.getUTCMinutes())};
const dmhm=t=>{const d=new Date(t+252e5);return `${d.getUTCDate()}/${p2(d.getUTCMonth()+1)} ${hm(t)}`};
const dur=ms=>{const m=Math.max(0,Math.floor(ms/6e4)),h=Math.floor(m/60);return(h?h+' ชม. ':'')+(m%60)+' นาที'};
/* ช่องเวลา 24 ชม. — input type=time ของเบราว์เซอร์โชว์ AM/PM ตามภาษาเครื่อง บังคับไม่ได้
   ค่าจริงอยู่ใน hidden input id เดิม (โค้ดเดิมอ่าน $(id).value ได้เหมือนเดิม) · ตั้งค่าจากโค้ดต้องใช้ tSet */
const tNorm=v=>{const m=String(v||'').match(/^(\d{1,2})[:.](\d{2})/);return m&&+m[1]<24&&+m[2]<60?p2(+m[1])+':'+m[2]:''};
function tOpts(list,v){return '<option value="">--</option>'+list.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}
function tMins(m){const a=[...Array(12)].map((_,i)=>p2(i*5));if(m&&a.indexOf(m)<0){a.push(m);a.sort()}return a}
function tpick(id,v,dis){v=tNorm(v);const h=v.slice(0,2),m=v.slice(3),d=dis?'disabled':'';
 return `<span class="tp" data-for="${id}"><select ${d} onchange="tRead('${id}')">${tOpts([...Array(24)].map((_,i)=>p2(i)),h)}</select><b>:</b><select ${d} onchange="tRead('${id}')">${tOpts(tMins(m),m)}</select></span><input type="hidden" id="${id}" value="${v}">`}
function tRead(id){const s=document.querySelectorAll('.tp[data-for="'+id+'"] select');if(s[0].value&&!s[1].value)s[1].value='00';$(id).value=s[0].value?s[0].value+':'+s[1].value:''}
function tSet(id,v){v=tNorm(v);const s=document.querySelectorAll('.tp[data-for="'+id+'"] select');if(!s.length||!$(id))return;
 s[1].innerHTML=tOpts(tMins(v.slice(3)),v.slice(3));s[0].value=v.slice(0,2);$(id).value=v}
/* เวลาไทยจาก วันที่ + HH:MM โดยไม่ขึ้นกับเขตเวลาของเครื่อง */
const bkkTs=(ds,t)=>{const a=ds.split('-');return Date.UTC(+a[0],a[1]-1,+a[2],+t.slice(0,2),+t.slice(3,5))-252e5};
const bkkDay=ts=>new Date(ts+252e5).toISOString().slice(0,10);
const cur=j=>j.rounds[j.rounds.length-1];
const rPrice=r=>r.trucks.reduce((a,t)=>a+t[1]*t[2],0);
const tPrice=j=>j.rounds.reduce((a,r)=>a+rPrice(r),0);
const received=j=>j.rounds.reduce((a,r)=>a+(r.pay?r.pay.a:0),0);
const rExp=r=>(r.exp||[]).reduce((a,e)=>a+e[1],0);
const tExp=j=>j.rounds.reduce((a,r)=>a+rExp(r),0);
const owed=j=>Math.max(0,j.rounds.reduce((a,r)=>a+(r.st=='done'?rPrice(r)-(r.pay?r.pay.a:0):0),0));
const win=r=>r.to?r.from+'–'+r.to:r.from;
const HOLD=r=>!!(r.hold||!r.date);
const trk=(r,sep)=>r.trucks.filter(t=>t[0]!='ราคางาน').map(t=>esc(t[0])+' ×'+t[1]).join(sep||' ');
const toM=s=>{const p=String(s||'').split(':');return +p[0]*60+ +p[1]};
const nowM=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const mTo=j=>toM(cur(j).from)-nowM();
const hmTxt=m=>(m>=60?Math.floor(m/60)+' ชม. ':'')+(m%60)+' นาที';
// ระดับเตือนของงานที่ยังไม่ออกเดินทาง: late=เลยเวลา · hot=ภายใน 1 ชม. (งานด่วน) · warn=ภายใน 4 ชม.
function lvl(j){const r=cur(j);if(j.status!='open'||!['wait','ok'].includes(r.st)||HOLD(r))return'';if(late(j))return'late';if(r.date!=TODAY())return'';const m=mTo(j);return m<=60?'hot':m<=240?'warn':''}
const late=j=>{const r=cur(j);if(j.status!='open'||!['wait','ok'].includes(r.st)||HOLD(r))return false;const t=TODAY();return r.date<t||(r.date==t&&(r.to||r.from)<nowHM())};
const img=(id,w)=>'https:'+'/'+'/drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w'+(w||400);
// ลิงก์แผนที่จากข้อมูลงานใช้ได้เฉพาะ http(s) (ShopPOS: หน้านี้อยู่ที่เดียวกับโปรแกรม ลิงก์ javascript: ห้ามผ่าน)
const mapUrl=(a,l)=>(/^https?:[/][/]/i.test(String(l||''))?l:'')||('https:'+'/'+'/www.google.com/maps/search/?api=1&query='+encodeURIComponent(a));
const msg=e=>(e&&e.message)||String(e);
const nl=s=>esc(s).replace(/\n/g,'<br>');
/* ค่าจากข้อมูล (เลขงาน/เลขรูป/ชื่อคน) ที่ใส่เป็นอาร์กิวเมนต์ใน onclick="…" — ทำเป็นสตริง JS ก่อนแล้วค่อย esc
   (esc อย่างเดียวไม่พอ: ตัวอ่าน HTML ถอด &#39; กลับเป็น ' ก่อนรันสคริปต์ → ชื่อที่มี ' ทำปุ่มพัง/สั่งรันโค้ดได้ ·
   ShopPOS: หน้านี้ใช้ api ของโปรแกรมได้ทั้งหมด) */
const jsa=v=>esc(JSON.stringify(String(v==null?'':v)));

/* ---------- เชื่อมเซิร์ฟเวอร์ ---------- */
/* ShopPOS: แทน google.script.run — กดปุ่มแล้วคิดผลในเครื่องทันที (ngn-core.js = โค้ดเดียวกับเว็บ)
   ตัวโปรแกรมเก็บงาน + คิวคำสั่ง แล้วส่งให้เว็บงานนอกเบื้องหลัง (เน็ตหลุดก็กดได้ ส่งทีหลังเอง) */
const SHOP=window.parent&&window.parent!==window?window.parent:null;
let SYNC={pending:0,sync:{}},LOADS=0;
async function call(path,body){
 if(!SHOP||typeof SHOP.api!=='function')throw new Error('เปิดหน้านี้จากโปรแกรม ShopPOS (เมนู หลังบ้าน → งานนอก)');
 try{return await SHOP.api(path,body)}catch(e){if(e&&e.data&&typeof e.data==='object')return e.data;throw e}
}
let NGN_BC=null;try{NGN_BC=new BroadcastChannel('shoppos-ngn-data');NGN_BC.onmessage=()=>{if(!BUSY)load(true)}}catch(e){}   // load ซ้อนกันไม่ได้ (รวมเป็นรอบเดียว)
function ngnTell(){try{NGN_BC&&NGN_BC.postMessage(1)}catch(e){}}
async function run(fn,...a){
 if(fn==='uploadPhoto')return call('ngn/photo',{b64:a[0],name:a[1]});
 const req=a[0]||{};
 if(req.action==='list'){const r=await call('ngn'+(LOADS++?'':'?fresh=1'));syncPaint(r);return r}
 if(req.action==='shop'||req.action==='setShop'||req.action==='route'||req.action==='links')return call('ngn/web',{req});   // แผนที่: ถามเว็บงานนอกตรง ๆ (ต้องต่อเน็ต)
 if(req.action==='undo'){const r=await call('ngn/undo',{lid:req.logId,by:req.by});if(r.ok)ngnTell();return r}
 // เวลาที่กดจริง (at): คำสั่งที่ค้างส่งทีหลัง เว็บใช้เวลานี้แทนเวลาที่ส่งถึง · ปิดงานไม่ได้ใส่เวลาเสร็จ = ใส่เวลาที่กดให้ (autoEnd)
 // (เว็บรุ่นที่ยังไม่รู้จัก at จะได้เวลาเสร็จจริง ไม่ปฏิเสธงานที่ส่งถึงหลังเที่ยงคืน)
 if(['depart','confirm','finish','verify'].indexOf(req.action)>=0){const at=Date.now();req.p=Object.assign({},req.p||{},{at});if(req.action==='finish'&&!req.p.endTime){req.p.endTime=hm(at);req.p.autoEnd=true}}
 let m;
 try{m=NGN_CORE.mutate(req,J)}catch(e){return{ok:false,error:String(e&&e.message||e)}}
 if(m.conflict)return{ok:false,conflict:true,job:m.job,error:m.error};
 const lid='A'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
 const r=await call('ngn/apply',{lid,req,job:m.job||null,text:m.text});
 if(r.ok){ngnTell();reloadSoon(6000)}   // ส่งถึงเว็บแล้วได้เลขงานจริง/ฉบับจริง
 return r;
}
/* สถานะส่ง/ดึงกับเว็บ (มุมบนซ้าย) */
let SYNC_NOTE='';
function syncPaint(r){
 SYNC=r||SYNC;const e=$('syncSt'),s=SYNC.sync||{},n=+SYNC.pending||0;
 e.className='syncSt'+(n?' wait':s.err?' off':'');
 e.textContent=n?'⏳ รอส่งขึ้นเว็บ '+n+' คำสั่ง':s.err?'☁ ✗ '+s.err:'☁ ✓ ตรงกับเว็บแล้ว';
 if(s.note&&s.note!==SYNC_NOTE){SYNC_NOTE=s.note;alertBox('⚠ '+s.note+'\nระบบใช้ข้อมูลล่าสุดจากเว็บแทนแล้ว')}
 if(n)reloadSoon(SYNC_WAIT);   // ยังมีคำสั่งรอส่ง = ดูใหม่อีกครั้งเร็ว ๆ (ตัวตั้งเวลาเดียว ไม่ซ้อน)
}
async function syncNow(){try{await call('ngn/sync',{});reloadSoon(3000)}catch(e){alertBox(msg(e))}}

function hideBusy(){BUSY=false;$('busy').classList.remove('on')}

/* โหลดรายการงาน — ขอซ้อนกันกี่ครั้งก็โหลดทีละรอบ (กำลังโหลดอยู่ = นัดอีกแค่รอบเดียวหลังรอบนี้ · await แล้วได้ข้อมูลหลังที่ขอเสมอ)
   ShopPOS: เดิมทุกการโหลดตอนมีคำสั่งรอส่ง ตั้งรอบใหม่ทุก 8 วิ ซ้อนกันเพิ่มเรื่อย ๆ ทั้งวัน (เน็ตหลุด/เว็บยังไม่อัปเดต = เครื่องอืด) */
let LOAD_P=null,LOAD_NEXT=null,RELOAD_T=null,RELOAD_AT=0,SYNC_WAIT=8000;
function load(silent){
 if(LOAD_P){if(!LOAD_NEXT)LOAD_NEXT=LOAD_P.then(()=>{LOAD_NEXT=null;return load(silent)});return LOAD_NEXT}
 LOAD_P=load1(silent).finally(()=>{LOAD_P=null});

const autoOk=()=>!document.hidden||!!SHOP;
/* โหลดซ้ำภายหลัง: ตัวตั้งเวลาเดียว (นัดซ้อน = ใช้นัดที่เร็วกว่า) */
function reloadSoon(ms){const at=Date.now()+ms;if(RELOAD_T&&RELOAD_AT<=at)return;clearTimeout(RELOAD_T);RELOAD_AT=at;
 RELOAD_T=setTimeout(()=>{RELOAD_T=null;if(BUSY)reloadSoon(2000);else if(autoOk())load(true)},ms)}
async function load1(silent){
 if(!silent)showBusy('กำลังโหลด...');
 try{const r=await run('api',{action:'list'});if(!r.ok)throw new Error(r.error);
  // มีหน้าต่างเปิดอยู่: อัพเดตแค่แถบเตือน/ป้าย POS ไม่แตะข้อมูลที่กำลังแก้ · หน้าต่างถูกย่ออยู่: ส่งตัวเลขให้ POS พอ (กลับมาเห็นจอค่อยวาด)
  if($('m').classList.contains('on')||(silent&&document.hidden)){notifyParent(r.jobs,soonBanner(r.jobs));return}
  J={};r.jobs.forEach(j=>J[j.id]=j);STAFF=r.staff||[];CAL_ID=r.calId||'';render();if(!ME&&!silent)pickMe();
  if(r.ready===false&&!r.jobs.length)$('list').innerHTML='<div class="empty">ยังไม่ได้ข้อมูลจากเว็บงานนอก<br><small>'+esc((r.sync&&r.sync.err)||'กำลังดึงข้อมูล…')+'</small></div>'}
 catch(e){if(!silent)alertBox('โหลดข้อมูลไม่สำเร็จ: '+msg(e))}
 finally{if(!silent)hideBusy()}
}
async function act(action,id,p,okText){
 if(!ME){pickMe();return false}
 const j=id?J[id]:null;showBusy();
 try{
  const r=await run('api',{action,id,ver:j?j.version:null,by:ME,p});
  if(r.job)J[r.job.id]=r.job;if(r.deleted)r.deleted.forEach(x=>delete J[x]);
  if(!r.ok){render();alertBox(r.error);return false}
  if(action=='create'){NEWDRAFT=null;$('sh').dataset.form=''}
  close_();render();toastMsg('✓ '+(okText||'บันทึกแล้ว'),r.logId);if(r.calWarn)alertBox(r.calWarn);return r;
 }catch(e){alertBox('บันทึกไม่สำเร็จ: '+msg(e)+'\nข้อมูลยังไม่ถูกบันทึก ลองกดใหม่อีกครั้ง');return false}
 finally{hideBusy()}
}
async function undo(){
 if(!LAST_LOG)return;const id=LAST_LOG;LAST_LOG='';$('toast').classList.remove('on');showBusy('กำลังย้อนกลับ...');
 try{const r=await run('api',{action:'undo',logId:id,by:ME});if(r.job)J[r.job.id]=r.job;if(r.deleted)r.deleted.forEach(x=>delete J[x]);render();if(!r.ok)return alertBox(r.error);toastMsg('↩ ย้อนกลับแล้ว',null)}
 catch(e){alertBox('ย้อนกลับไม่สำเร็จ: '+msg(e))}finally{hideBusy()}
}

let ZL=[],ZI=0;
function zoomPics_(j){const a=[...(j.photos||[])];(j.rounds||[]).forEach(x=>{(x.after||[]).forEach(p=>a.push(p));if(x.pay&&x.pay.slip)a.push(x.pay.slip)});return a.filter((p,i)=>p&&a.indexOf(p)===i)}
function zoom(id,jid){const L=jid&&J[jid]?zoomPics_(J[jid]):[];ZL=L.indexOf(id)>=0?L:[id];ZI=ZL.indexOf(id);
 $('zmt').innerHTML=ZL.length>1?ZL.map((p,i)=>`<img src="${img(p,120)}" data-i="${i}" alt="">`).join(''):'';
 $('zm').classList.toggle('one',ZL.length<2);$('zm').classList.add('on');zoomShow()}
function zoomShow(){$('zmi').src=img(ZL[ZI],1600);$('zmc').textContent=(ZI+1)+' / '+ZL.length;
 $('zmt').querySelectorAll('img').forEach((t,i)=>{t.classList.toggle('on',i===ZI);if(i===ZI)t.scrollIntoView({block:'nearest',inline:'center'})});
 [1,-1].forEach(d=>{if(ZL.length>1)new Image().src=img(ZL[(ZI+d+ZL.length)%ZL.length],1600)})}
function zoomGo(d){if(ZL.length<2)return;ZI=(ZI+d+ZL.length)%ZL.length;zoomShow()}
function zoomClose(){$('zm').classList.remove('on');$('zmi').removeAttribute('src')}
$('zmt').onclick=e=>{const i=e.target.dataset&&e.target.dataset.i;if(i!=null){ZI=+i;zoomShow()}};
document.addEventListener('keydown',e=>{if(!$('zm').classList.contains('on'))return;if(e.key==='ArrowRight')zoomGo(1);else if(e.key==='ArrowLeft')zoomGo(-1);else if(e.key==='Escape')zoomClose();else return;e.preventDefault()});
(()=>{let x0=null,y0=0;const z=$('zm');z.addEventListener('touchstart',e=>{if(e.touches.length===1){x0=e.touches[0].clientX;y0=e.touches[0].clientY}else x0=null},{passive:true});
 z.addEventListener('touchend',e=>{if(x0==null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))zoomGo(dx<0?1:-1)},{passive:true})})();

/* ---------- รูป ---------- */
function compress(file,max=1600,q=.8){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error('อ่านไฟล์ไม่ได้'));fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('ไฟล์นี้ไม่ใช่รูป'));im.onload=()=>{let w=im.width,h=im.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',q))};im.src=fr.result};fr.readAsDataURL(file)})}
async function upload(files,prefix,each){const ids=[];let i=0;for(const f of files){i++;each&&each(i,files.length,null);const b=await compress(f);const r=await run('uploadPhoto',b,prefix);if(!r.ok)throw new Error(r.error);ids.push(r.id);each&&each(i,files.length,b,r.id)}return ids}
async function addPics(id,inp){const fs=[...inp.files];inp.value='';if(!fs.length)return;if(!ME){pickMe();return}
 showBusy('กำลังอัปโหลดรูป...');try{const ids=await upload(fs,id,(i,n)=>$('busyT').textContent=`กำลังอัปโหลดรูป ${i}/${n}...`);hideBusy();await act('addPhotos',id,{ids},`เพิ่มรูป ${ids.length} รูป`)}
 catch(e){hideBusy();alertBox(msg(e))}}

function formPics(inp,key,prevId,single){const fs=[...inp.files];inp.value='';if(!fs.length)return;const f=F;f.up=(f.up||0)+1;const pv=$(prevId);
 const tmp=document.createElement('div');tmp.className='mu';tmp.textContent='กำลังอัปโหลด...';pv.appendChild(tmp);
 upload(single?fs.slice(0,1):fs,key,(i,n,b,id)=>{tmp.textContent=`กำลังอัปโหลด ${i}/${n}...`;if(b){if(single){f[key]=id;pv.querySelectorAll('img').forEach(x=>x.remove())}else f[key].push(id);const im=document.createElement('img');im.src=b;pv.insertBefore(im,tmp)}})
  .then(()=>tmp.remove()).catch(e=>{tmp.textContent='⚠ '+msg(e)}).finally(()=>{f.up--;if(f===F&&$('sumbox'))calc()})}

function readTrucks(id){return [...$(id).querySelectorAll('.tr')].map(d=>{const i=d.querySelectorAll('input');return[i[0].value.trim(),Number(i[1].value),i[2].value===''?NaN:Number(i[2].value)]}).filter(t=>t[0]||!isNaN(t[2]))}
function checkTrucks(T){if(!T.length)return'ใส่รถและราคาอย่างน้อย 1 แถว';for(const t of T){if(!t[0])return'ใส่ชนิดรถ';if(!(t[1]>=1))return'จำนวนคันต้องอย่างน้อย 1';if(!(t[2]>=0))return'ใส่ราคาต่อคัน'}return''}

 <label>\uD83D\uDCF7 รูปหน้างาน</label><div class="pics" id="fPv">${F.photos.map(id=>`<span class="fp" style="position:relative;flex:none"><img src="${img(id)}" alt=""><button class="btn r sm" type="button" style="position:absolute;top:2px;right:2px;padding:0 6px" onclick="F.photos=F.photos.filter(x=>x!==${jsa(id)});this.parentNode.remove()">✕</button></span>`).join('')}</div><input type="file" accept="image/\*" multiple onchange="formPics(this,'photos','fPv')">

// ล้างฟอร์ม: ต้องปิดโหมด new ก่อน close_() ไม่งั้น keepDraft() เซฟฟอร์มเดิมกลับมา
function clearForm(){$('sh').dataset.form='';NEWDRAFT=null;close_();newJob()}
function keepDraft(){
 if($('sh').dataset.form!=='new'||!$('fName'))return;
 const d={};['paste','fDate','fFrom','fTo','fName','fTel','fType','fDetail','fNote','fPick','fPickMap','fDrop','fDropMap','fPrice'].forEach(k=>d[k]=$(k)?$(k).value:'');
 d.fUrg=$('fUrg').checked;d.fConf=$('fConf').checked;d.photos=F.photos;

function saveJob(){
 const e=m=>{$('ferr').textContent='⚠ '+m};
 if(F.up)return e('รอรูปอัปโหลดให้เสร็จก่อน');
 const edit=F.edit;

 if($('fPrice')){const v=$('fPrice').value.trim();if(v===''||!(+v>=0))return e('ใส่ราคางาน');p.price=+v}else p.trucks=cur(J[edit]).trucks;
 const held=edit&&HOLD(cur(J[edit]))&&!p.date;
 if(!p.name)return e('ใส่ชื่อลูกค้า');if(!held){if(!p.date)return e('ใส่วันนัด');if(!p.from)return e('ใส่เวลานัด');if(p.to&&p.to<=p.from)return e('เวลาสิ้นสุดต้องหลังเวลาเริ่ม')}
 if(edit){p.reason=$('fReason').value;return act('editAll',edit,p,'แก้ไขงานแล้ว')}
 p.confirmed=$('fConf').checked;

function doParse(){const o=parseChat($('paste').value);const set=(id,v)=>{if(v!=null&&v!=='')$(id).value=v};
 if(!$('fDate').disabled){set('fDate',o.date);if(o.from)tSet('fFrom',o.from);if(o.to)tSet('fTo',o.to)}   // งานที่ออกเดินทาง/เลื่อนนัดแล้ว วัน-เวลาถูกล็อก ห้ามเขียนทับ
 set('fName',o.name);set('fTel',o.tel);set('fType',o.type);set('fDetail',o.detail);set('fPick',o.pick);set('fPickMap',o.pickMap);set('fDrop',o.drop);set('fDropMap',o.dropMap);
 if(o.urgent)$('fUrg').checked=true;$('dropBox').hidden=!(o.type=='ขนย้าย'||o.drop);
 if(o.trucks.length&&$('fPrice'))$('fPrice').value=tsum(o.trucks);
 $('pmsg').innerHTML='<div class="ok">✓ แยกข้อมูลแล้ว ตรวจทุกช่องอีกครั้งก่อนบันทึก</div>'}
function parseChat(t){
 const o={trucks:[],detail:''};t=String(t||'');const lines=t.split(/\r?\n/).map(s=>s.trim());
 if(/งานด่วน/.test(t))o.urgent=true;
 const MK=['มค','กพ','มีค','เมย','พค','มิย','กค','สค','กย','ตค','พย','ธค'];
 const md=t.match(/(\d{1,2})\s*(ม\.?\s?ค|ก\.?\s?พ|มี\.?\s?ค|เม\.?\s?ย|พ\.?\s?ค|มิ\.?\s?ย|ก\.?\s?ค|ส\.?\s?ค|ก\.?\s?ย|ต\.?\s?ค|พ\.?\s?ย|ธ\.?\s?ค)/);
 if(md){const m=MK.indexOf(md[2].replace(/[.\s]/g,''))+1;const n=new Date();let y=n.getFullYear();if(m<n.getMonth()+1-6)y++;if(m>0)o.date=y+'-'+p2(m)+'-'+p2(+md[1])}
 const tr=t.match(/(\d{1,2})[.:](\d{2})\s*(?:น\.?)?\s*[-–]\s*(\d{1,2})[.:](\d{2})/);
 if(tr){o.from=p2(tr[1])+':'+tr[2];o.to=p2(tr[3])+':'+tr[4]}else{const t1=t.match(/เวลา\s*(\d{1,2})[.:](\d{2})/);if(t1)o.from=p2(t1[1])+':'+t1[2]}
 const links=t.match(/https?:\/\/\S+/g)||[];
 const moving=/จุดที่ต้องขนย้ายไป|ขนย้าย/.test(t);
 const noRue=t.replace(/ไม่(?:มี|ต้อง)(?:การ)?\S*รื้อ(?:\S*)/g,'');
 o.type=/ขนย้าย/.test(t)?'ขนย้าย':/รื้อ/.test(noRue)?'รื้อ + ขนทิ้ง':'ขนทิ้ง';
 if(links[0])o.pickMap=links[0];if(moving&&links[1])o.dropMap=links[1];
 const det=[];let mode='',addr=[];
 const tk=s=>{s=s.replace(/\s/g,'');return /หก|6/.test(s)?'6 ล้อ':/สิบ|10/.test(s)?'10 ล้อ':/กระบะ/.test(s)?'กระบะ':'รถ'};
 lines.forEach((s,i)=>{
  if(!s||/^[-–—_=]{3,}$/.test(s)||/https?:\/\/\S/.test(s))return;
  if(i===0&&(md||/งานด่วน/.test(s)))return;
  let m;
  if(m=s.match(/^ชื่อ(?:ลูกค้า)?\s*[:：]\s*(.*)$/)){o.name=m[1].trim();mode='';return}
  if(m=s.match(/^เบอร์(?:โทร)?\s*[:：]\s*(.*)$/)){o.tel=m[1].trim();mode='';return}
  if(m=s.match(/^รายละเอียด(?:งาน)?\s*[:：]\s*(.*)$/)){if(m[1])det.push(m[1]);mode='det';return}
  if(m=s.match(/^(?:หมายเหตุ|ที่อยู่)\s*[:：]\s*(.*)$/)){if(m[1])addr.push(m[1]);mode='addr';return}
  if(/^ราคา/.test(s)){mode='price';const x=s.match(/([\d,]{3,})\s*บาท/);if(x&&!/รถ/.test(s))o.trucks.push(['รถ',1,+x[1].replace(/,/g,'')]);else if(x){const y=s.match(/([\d,]{3,})\s*บาท\s*ต่อ\s*(?:รอบ)?\s*(?:ต่อ)?\s*(รถ\S*)\s*(\d+)?/);if(y)o.trucks.push([tk(y[2]),+(y[3]||1),+y[1].replace(/,/g,'')])}return}
  if(m=s.match(/^(?:รถ)?\s*(หกล้อ|6\s*ล้อ|สิบล้อ|10\s*ล้อ|กระบะ)\s*(\d+)\s*คัน\s*([\d,]+)\s*บาท/)){o.trucks.push([tk(m[1]),+m[2],+m[3].replace(/,/g,'')]);return}
  if(/^(?:\uD83D\uDCCD)?\s*จุดที่ของอยู่|^(?:\uD83C\uDF40)?\s*จุดที่ต้องขนย้ายไป/.test(s))return;
  if(mode=='addr'&&!/^(?:\uD83D\uDCCC|\uD83D\uDEA8|⚠|❗|‼|\*)/u.test(s)){addr.push(s);return}
  if(mode=='addr')mode='';
  if(mode=='price')return;
  det.push(s);
 });
 if(o.trucks.length>1&&o.trucks[0][0]=='รถ'&&o.trucks[0][1]==1)o.trucks.shift();
 o.trucks=o.trucks.filter((x,i,a)=>!(x[0]=='รถ'&&a.length>1));
 o.trucks.forEach(x=>{if(x[0]=='รถ')x[0]=/รถ\s*กระบะ/.test(t)?'กระบะ':/หกล้อ|6\s*ล้อ/.test(t)?'6 ล้อ':/สิบล้อ|10\s*ล้อ/.test(t)?'10 ล้อ':'รถ'});
 if(addr[0])o.pick=addr[0];if(moving&&addr[1])o.drop=addr.slice(1).join(' ');else if(addr.length>1)o.pick=addr.join(' ');
 o.detail=det.join('\n');return o}

 if(r.fromCont&&['ok','wait'].includes(r.st))return`ลบรอบ ${r.no} แล้วเปิดรอบ ${r.no-1} กลับเป็น "กำลังไป"`;return({go:'กำลังไป → คอนเฟิร์มแล้ว',ok:'คอนเฟิร์มแล้ว → ยังไม่คอนเฟิร์ม'})[r.st]||''}

/* ---------- เสร็จงาน + รับเงิน ---------- */
function finish(id){const j=J[id],r=cur(j),ob=owed(j);
 F={id,slip:'',after:[],exp:[],end:true,payNow:true,big:0,up:0,ob};
 modal(`<h3>✔ เสร็จงาน · ${esc(j.name)}${j.rounds.length>1?' (รอบ '+r.no+')':''}</h3>
 ${r.goAt?`<div class="timer">⏱ ออกเดินทาง ${hm(r.goAt)} → ตอนนี้ ${hm(Date.now())} · ใช้เวลา <b>${dur(Date.now()-r.goAt)}</b></div>`:''}
 <div class="box" style="background:#f5f3ff"><b>⏱ เวลาจริง</b> <span class="mu" style="font-size:12px">ลืมกดตอนหน้างาน แก้ตรงนี้ได้ · ไม่ใส่เวลาเสร็จ = ใช้เวลาตอนกดยืนยัน (เฉพาะงานวันนี้) · เสร็จหลังเที่ยงคืนใส่เวลาได้เลย ระบบรู้ว่าข้ามวัน</span>
  <label>วันที่ไปทำงาน</label><input type="date" id="endDate" value="${r.date&&r.date<=TODAY()?r.date:TODAY()}" max="${TODAY()}">
  <div class="g2"><div><label>ออกเดินทางจริง</label>${tpick('goTime',r.goAt?hm(r.goAt):'')}</div><div><label>เสร็จจริง</label>${tpick('endTime','')}</div></div></div>
 <div id="payBox">
  <label>ยอดรับจริง (บาท)</label><input type="number" inputmode="numeric" id="amt" value="${rPrice(r)+ob}" oninput="calc()">

  <div class="pay"><label><input type="radio" name="pm" value="เงินสด" onchange="$('slipbox').hidden=true;calc()"> \uD83D\uDCB5 เงินสด</label><label><input type="radio" name="pm" value="โอน" onchange="$('slipbox').hidden=false;calc()"> \uD83D\uDCF1 เงินโอน</label></div>
  <div class="box" id="slipbox" hidden><b>\uD83D\uDCCE แนบสลิปโอน (บังคับ)</b><div class="pics" id="slipPv"></div><input type="file" accept="image/\*" onchange="formPics(this,'slip','slipPv',true)"></div></div>
 <label>\uD83E\uDDFE ค่าใช้จ่ายรอบนี้ <span class="mu">(ถ้ามี กดเพิ่มได้ · ไม่มีก็ข้ามได้)</span></label>
 <div class="box" id="expbox"><div class="cats">${CATS.map(c=>`<button class="btn o" type="button" onclick="addExp('${c}')">${c}</button>`).join('')}</div><div id="exrows"></div></div>
 <div class="sumbox" id="sumbox"></div>
 <div class="err" id="ferr"></div>
 <div class="acts"><button class="btn g" onclick="doFinish()">ยืนยัน</button><button class="btn o" onclick="close_()">ยกเลิก</button></div>`);calc()}
function payDefault(){const j=J[F.id];return rPrice(cur(j))+(F.end?F.ob:0)}
function addExp(c){F.exp.push([c,0,SRC[0]]);drawExp()}
function drawExp(){$('exrows').innerHTML=F.exp.map((e,i)=>`<div class="exrow"><b>${esc(e[0])}</b><input type="number" inputmode="numeric" placeholder="บาท" value="${e[1]||''}" oninput="F.exp[${i}][1]=+this.value;F.big=0;calc()"><select onchange="F.exp[${i}][2]=this.value;calc()">${SRC.map(s=>`<option ${s==e[2]?'selected':''}>${s}</option>`).join('')}</select><button class="btn r sm" type="button" onclick="F.exp.splice(${i},1);drawExp()">✕</button></div>`).join('');calc()}
function calc(){const j=J[F.id];if(!j||!$('sumbox'))return;const r=cur(j),pay=F.payNow?(+$('amt').value||0):0,pm=(document.querySelector('[name=pm]:checked')||{}).value,E=F.exp,
 t=E.reduce((a,e)=>a+(e[1]||0),0),fromJob=E.filter(e=>e[2]==SRC[0]).reduce((a,e)=>a+(e[1]||0),0),owe=E.filter(e=>e[2]==SRC[1]).reduce((a,e)=>a+(e[1]||0),0);
 let h=`<div class="row"><span>ราคา${j.rounds.length>1?'รอบนี้':'งาน'}</span><b>${fmt(rPrice(r))}</b></div>`;
 if(F.end&&F.ob)h+=`<div class="row oweb"><span>+ ยอดรอบก่อนที่รอเก็บ</span><b>${fmt(F.ob)}</b></div>`;
 if(F.payNow===false)h+=`<div class="row oweb"><span>\uD83D\uDD52 รอบนี้เก็บรวมตอนจบงาน</span><b>${fmt(rPrice(r))}</b></div>`;
 h+=`<div class="row"><span>รับจากลูกค้าตอนนี้</span><b>${fmt(pay)}</b></div><div class="row"><span>ค่าใช้จ่าย</span><b style="color:${t?'var(--r)':'var(--mu)'}">${t?'-'+fmt(t):'0'}</b></div><div class="row big"><span>เหลือ (รับ − จ่าย)</span><b>${fmt(pay-t)} ฿</b></div>`;
 if(pm=='เงินสด'&&F.payNow)h+=`<div class="row cash"><span>\uD83D\uDCB5 เงินสดที่ต้องส่งคืนร้าน</span><b>${fmt(pay-fromJob)} ฿</b></div>`;
 else if(fromJob)h+=`<div class="row oweb"><span>⚠ "หักจากเงินค่างาน" ใช้ได้เฉพาะรับเงินสด</span><b>${fmt(fromJob)}</b></div>`;
 if(owe)h+=`<div class="row oweb"><span>\uD83D\uDC77 ร้านต้องคืนเงินลูกน้อง</span><b>${fmt(owe)} ฿</b></div>`;

/* ต้องคิดแบบเดียวกับ finishTimes_ ในรหัส.gs — วันที่ไปทำงานเป็นหลัก เสร็จก่อนออก = ข้ามคืน */
function finishPick(r){
 const day=$('endDate').value||TODAY(),et=$('endTime').value,gt=$('goTime').value,now=Date.now();
 if(!/^\d{4}-\d{2}-\d{2}$/.test(day))return{err:'วันที่ไปทำงานไม่ถูกต้อง'};
 let goT=r.goAt||null;
 if(gt){const t=bkkTs(day,gt);goT=(r.goAt&&Math.abs(t-r.goAt)<6e4)?r.goAt:t}
 let endT;
 if(et){endT=bkkTs(day,et);if(goT&&endT<goT)endT+=864e5}
 else{if(day!==TODAY())return{err:'งานวันที่ '+fmtD(day)+' ไม่ใช่วันนี้ — ใส่เวลา "เสร็จจริง" ด้วย'};endT=now}
 if(goT&&goT>now+3e5)return{err:'เวลาออกเดินทางจริงอยู่ในอนาคต — เช็กวันที่กับเวลาอีกครั้ง'};
 if(endT>now+3e5)return{err:'เวลาเสร็จจริงอยู่ในอนาคต — เช็กวันที่กับเวลาอีกครั้ง'};
 if(goT&&endT<goT)return{err:'เวลาเสร็จ ('+hm(endT)+') ต้องหลังเวลาออกเดินทาง ('+hm(goT)+')'};
 return{endDate:day,endTime:et,goTime:gt}}
function doFinish(){const e=m=>{$('ferr').textContent='⚠ '+m};const j=J[F.id],r=cur(j);
 if(F.up)return e('รอรูปอัปโหลดให้เสร็จก่อน');
 const EX=F.exp.filter(x=>x[1]>0);
 const p={end:F.end,payNow:F.payNow===true,after:[],exp:EX};
 const tp=finishPick(r);if(tp.err)return e(tp.err);Object.assign(p,tp);
 if(p.payNow){const pm=document.querySelector('[name=pm]:checked');p.a=+$('amt').value;if(!(p.a>0))return e('ใส่ยอดเงินที่รับจริง');if(!pm)return e('เลือกก่อนว่าได้รับเป็นเงินสดหรือเงินโอน');p.m=pm.value;
  if(p.m=='โอน'){if(!F.slip)return e('เงินโอนต้องแนบสลิปก่อนปิดงาน');p.slip=F.slip}}
 if(p.m!='เงินสด'&&EX.some(x=>x[2]==SRC[0]))return e('"หักจากเงินค่างาน" ใช้ได้เฉพาะตอนรับเงินสด เปลี่ยนเป็น "ลูกน้องออกก่อน" หรือ "เงินร้าน"');
 if(!F.big&&((EX.some(x=>x[1]>=1000))||(p.payNow&&p.a!==payDefault()))){F.big=1;return e((p.payNow&&p.a!==payDefault()?`ยอดรับ ${fmt(p.a)} ไม่ตรงกับยอดที่ต้องเก็บ ${fmt(payDefault())} · `:'')+(EX.some(x=>x[1]>=1000)?'มีค่าใช้จ่ายตั้งแต่ 1,000 บาท · ':'')+'ตรวจตัวเลขอีกครั้ง แล้วกด "ยืนยัน" อีกที')}
 act('finish',F.id,p,`เสร็จงาน ${j.name} · ${p.m} ${fmt(p.a)} ฿ · รอตรวจสอบ`)}

/* ---------- ตรวจสอบงาน (ใส่จำนวนคน → เสร็จแล้ว) ---------- */
function verify(id){const j=J[id],R=received(j),E=tExp(j),pays=j.rounds.filter(x=>x.pay);F={id,crew:0};
 modal(`<h3>\uD83D\uDD0D ตรวจสอบงาน · ${esc(j.name)}</h3>
 <div class="sumbox"><div class="row"><span>ราคางาน</span><b>${fmt(tPrice(j))}</b></div>
 ${pays.map(x=>`<div class="row"><span>รับ${x.pay.m=='โอน'?'เงินโอน':'เงินสด'}</span><b>${fmt(x.pay.a)}</b></div>${x.pay.slip?`<img src="${img(x.pay.slip,300)}" onclick="zoom(${jsa(x.pay.slip)},${jsa(id)})" style="max-height:120px;border-radius:8px;cursor:pointer" alt="สลิป">`:''}`).join('')}
 ${j.rounds.flatMap(x=>x.exp||[]).map(e=>`<div class="row"><span>− ${esc(e[0])} <span class="mu">(${esc(e[2])})</span></span><b style="color:var(--r)">${fmt(e[1])}</b></div>`).join('')}
 <div class="row big"><span>เหลือ (รับ − จ่าย)</span><b>${fmt(R-E)} ฿</b></div></div>
 ${j.rounds[0].goAt?`<div class="timer done">⏱ ${timeSummary(j)}</div>`:''}
 <label>ไปกี่คน</label><input type="number" id="crewN" inputmode="numeric" min="1" max="50" placeholder="พิมพ์จำนวนคนที่ไปงาน">
 <div class="err" id="ferr"></div>
 <div class="acts"><button class="btn g" id="yes">✔ ยืนยัน · เสร็จแล้ว</button><button class="btn o" onclick="close_()">ยกเลิก</button></div>`);
 $('yes').onclick=()=>{const n=+$('crewN').value;if(!(n>=1&&n<=50&&n===Math.floor(n)))return $('ferr').textContent='⚠ พิมพ์จำนวนคนที่ไปงาน (1–50)';act('verify',id,{crew:n},`ตรวจสอบแล้ว · ${j.name} · ${n} คน`)}}
function setCrew(n,el){F.crew=n;el.parentNode.querySelectorAll('button').forEach(b=>b.className='btn '+(b===el?'g':'o'))}

/* ---------- เลือกลบงาน (ลบถาวร) ---------- */
let SEL=null,LASTL=[];
function selMode(on){SEL=on?{}:null;render()}
function selTog(id,el){if(el.checked)SEL[id]=1;else delete SEL[id];selBar()}
function selAll(){if(!SEL)return;LASTL.forEach(i=>SEL[i]=1);render()}
function selBar(){$('selbar').hidden=!SEL;if(SEL){const n=Object.keys(SEL).length;$('selN').textContent=n?'เลือก '+n+' งาน':'ติ๊กงานที่จะลบ'}}
function delSel(){const ids=Object.keys(SEL||{}).filter(i=>J[i]);if(!ids.length)return alertBox('ยังไม่ได้เลือกงาน');
 modal(`<h3>\uD83D\uDDD1 ลบงานถาวร ${ids.length} งาน?</h3><div class="det open">${ids.map(i=>`• ${esc(J[i].name)} <span class="mu">${esc(i)} · ${HOLD(cur(J[i]))?'พักไว้':fmtD(cur(J[i]).date)} · ${fmt(tPrice(J[i]))} ฿</span>`).join('<br>')}</div>
 <p style="color:var(--r);font-weight:600">ลบแล้วงานหายจากระบบและปฏิทิน (ย้อนกลับไม่ได้)</p>
 <div class="acts"><button class="btn r" id="yes">ยืนยันลบ ${ids.length} งาน</button><button class="btn o" onclick="close_()">ไม่ใช่</button></div>`);
 $('yes').onclick=async()=>{const r=await act('deleteJobs',null,{ids},'ลบ '+ids.length+' งานแล้ว');if(r){SEL=null;render()}}}

/* ---------- สรุปยอด ---------- */
let SF='',STO='';
function setRange(k){const n=new Date(),t=TODAY();if(k=='d'){SF=STO=t}else if(k=='w'){SF=ymd(addDays(n,-6));STO=t}else if(k=='m'){SF=t.slice(0,8)+'01';STO=t}else{const a=new Date(n.getFullYear(),n.getMonth()-1,1),b=new Date(n.getFullYear(),n.getMonth(),0);SF=ymd(a);STO=ymd(b)}render()}
function sumView(A){if(!SF){SF=TODAY().slice(0,8)+'01';STO=TODAY()}
 const cd=j=>ymd(new Date(j.closedAt)),L=A.filter(j=>j.status=='closed'&&j.closedAt&&cd(j)>=SF&&cd(j)<=STO).sort((a,b)=>a.closedAt-b.closedAt);
 const pend=A.filter(j=>j.status=='review').length,P=L.flatMap(j=>j.rounds.filter(x=>x.pay).map(x=>x.pay)),EX=L.flatMap(j=>j.rounds.flatMap(x=>x.exp||[]));
 const inc=P.reduce((a,x)=>a+x.a,0),cash=P.filter(x=>x.m=='เงินสด').reduce((a,x)=>a+x.a,0),exs=EX.reduce((a,e)=>a+e[1],0),owe=EX.filter(e=>e[2]==SRC[1]).reduce((a,e)=>a+e[1],0),crew=L.reduce((a,j)=>a+(j.crew||0),0),cat={};
 EX.forEach(e=>cat[e[0]]=(cat[e[0]]||0)+e[1]);const mx=Math.max(1,...Object.values(cat)),d=x=>+x.slice(8)+'/'+x.slice(5,7);
 return `<div class="card noprint" style="--c:var(--pr)"><div class="g2"><div><label>ตั้งแต่วันที่</label><input type="date" value="${SF}" onchange="SF=this.value;render()"></div><div><label>ถึงวันที่</label><input type="date" value="${STO}" onchange="STO=this.value;render()"></div></div>
 <div class="acts"><button class="btn o sm" onclick="setRange('d')">วันนี้</button><button class="btn o sm" onclick="setRange('w')">7 วัน</button><button class="btn o sm" onclick="setRange('m')">เดือนนี้</button><button class="btn o sm" onclick="setRange('pm')">เดือนที่แล้ว</button></div>
 ${pend?`<p class="mu" style="margin:6px 0 0">\uD83D\uDD0D มีงานรอตรวจสอบ ${pend} งาน (ยังไม่นับในสรุป)</p>`:''}</div>
 <h3 style="margin:6px 0">สรุปยอด ${d(SF)} – ${d(STO)}</h3>
 <div class="stats" style="margin-bottom:10px;grid-template-columns:repeat(4,1fr)"><div class="st" style="--c:var(--b)"><b>${L.length}</b><span>งานที่เสร็จ</span></div><div class="st" style="--c:var(--pr)"><b>${fmt(inc)}</b><span>รายรับ</span></div><div class="st" style="--c:var(--r)"><b>${fmt(exs)}</b><span>ค่าใช้จ่าย</span></div><div class="st" style="--c:#14532d"><b style="color:#14532d">${fmt(inc-exs)}</b><span>กำไร</span></div></div>
 <div class="card" style="--c:var(--b)"><b>รับเงินทาง</b><div class="row"><span>\uD83D\uDCB5 เงินสด</span><b>${fmt(cash)} ฿</b></div><div class="row"><span>\uD83D\uDCF1 เงินโอน</span><b>${fmt(inc-cash)} ฿</b></div>${owe?`<div class="row"><span>\uD83D\uDC77 ลูกน้องออกเงินก่อน (ร้านต้องคืน)</span><b>${fmt(owe)} ฿</b></div>`:''}<div class="row"><span>\uD83D\uDC77 คนไปงานรวม</span><b>${fmt(crew)} คน</b></div></div>
 <div class="card" style="--c:var(--r)"><b>ค่าใช้จ่ายแยกประเภท</b>${Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><div><i style="width:${v/mx*100}%"></i></div><b>${fmt(v)}</b></div>`).join('')||'<p class="mu">ไม่มี</p>'}</div>
 <div class="card" style="--c:var(--mu)"><b>รายงาน</b><div style="overflow-x:auto"><table class="tb"><tr><th>วันที่</th><th>ลูกค้า</th><th>คน</th><th>รับ</th><th>จ่าย</th><th>กำไร</th></tr>${L.map(j=>{const R=received(j),E=tExp(j);return `<tr><td>${d(cd(j))}</td><td>${esc(j.name)}<br><small class="mu">${[...new Set(j.rounds.filter(x=>x.pay).map(x=>esc(x.pay.m)))].join('+')}</small></td><td>${j.crew||'-'}</td><td>${fmt(R)}</td><td>${fmt(E)}</td><td><b>${fmt(R-E)}</b></td></tr>`}).join('')}<tr class="tt"><td colspan="2">รวม</td><td>${fmt(crew)}</td><td>${fmt(inc)}</td><td>${fmt(exs)}</td><td>${fmt(inc-exs)}</td></tr></table></div>
 <div class="acts noprint"><button class="btn o" onclick="window.print()">\uD83D\uDDA8 พิมพ์ / PDF</button></div></div>
 <p class="mu" style="font-size:12px">นับเฉพาะงานที่ตรวจสอบแล้ว (เสร็จแล้ว) ตามวันที่กดตรวจสอบ · ย้อนหลังได้ประมาณ 4 เดือน</p>`}

/* ---------- เริ่มทำงาน ---------- */
setInterval(()=>{if(!BUSY&&autoOk())load(true)},60000);   // เปิดหน้าต่างค้างไว้ก็ยังเตือนงานด่วน/ส่งป้ายให้ POS (load เองไม่วาดรายการทับ) · ShopPOS: ถูกย่อ/ถูกบังก็ยังโหลด
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!BUSY)load(true)});
load();
</script></body></html>
